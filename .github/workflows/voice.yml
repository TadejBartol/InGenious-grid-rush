name: Glasovi zgodbe

# Teče sam ob vsaki spremembi zgodbe (in ročno: Actions → Glasovi zgodbe → Run workflow).
# Potrebuje skrivnosti repozitorija AZURE_SPEECH_KEY in AZURE_SPEECH_REGION; brez njih ne naredi nič.
# Generira samo nove ali spremenjene replike, posnetke pa shrani nazaj v isto vejo.
on:
  push:
    paths:
      - src/core/story.ts
      - scripts/voice.mjs
      - .github/workflows/voice.yml
  workflow_dispatch:

concurrency:
  group: voice-${{ github.ref }}

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - name: Brez ključa
        if: env.AZURE_SPEECH_KEY == ''
        run: echo "::notice::Skrivnost AZURE_SPEECH_KEY ni nastavljena, glasovi niso bili generirani."
      - uses: actions/checkout@v5
        if: env.AZURE_SPEECH_KEY != ''
      - uses: actions/setup-node@v5
        if: env.AZURE_SPEECH_KEY != ''
        with:
          node-version: 22
      - name: Generiraj glasove
        if: env.AZURE_SPEECH_KEY != ''
        run: node scripts/voice.mjs
      - name: Shrani posnetke v vejo
        if: env.AZURE_SPEECH_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add public/voice
          git diff --cached --quiet || git commit -m "Glasovi zgodbe"
          git push
