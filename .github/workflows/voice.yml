name: Glasovi zgodbe

# Ročni zagon: Actions → Glasovi zgodbe → Run workflow (izberi vejo).
# Potrebuje skrivnosti repozitorija AZURE_SPEECH_KEY in AZURE_SPEECH_REGION.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/voice.mjs
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Shrani posnetke v vejo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add public/voice
          git diff --cached --quiet || git commit -m "Glasovi zgodbe"
          git push
